name: build-war
on:
  push: 
    branches: ["main"]
jobs:
  build-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/chackout@v4
      - uses: actions/setup-java
        with:
          version: 17
          distribution: temurin

      - run: mvn clean package

      - uses: actions/artifact@v4
        with:
          name: build-war
        path: target/*.war
